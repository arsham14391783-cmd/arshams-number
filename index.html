    <h2>Definition</h2>

    <p>
        Arsham's Number is the biggest number with the limit of the symbols
        that has existed.
    </p>

    <p>
        If there is no limit, the number is infinite.
    </p>

    <h2>Formula</h2>

    <p><strong>Arsham() = 99</strong></p>

        <strong>Arsham's Number = Arsham^(9(9(9(9(9)9)9)9)9)</strong>
    </p>
